name: Release

# 推送 v* 标签时自动发布 Release：
#   1. 跨平台构建 CLI 二进制（raw binary + checksums.txt）
#   2. 打包 skill/ 目录为 scu-cli-skill.zip（内含 scu-cli/SKILL.md）
#   3. 从 CHANGELOG.md 提取对应版本的章节作为 Release 说明
#   4. 通过 OIDC Trusted Publishing 发布到 npm（无长期 token；postinstall 会从上面的
#      Release 下载二进制，所以必须在 Release 之后）
#      前提：npmjs.com 包设置页配置 Trusted Publisher =
#      The-Brotherhood-of-SCU / SCU-CLI / release.yml
#   5. 同步发布 Skill 到 SkillHub（https://www.skillhub.cn，CLI 方式，
#      见 https://skillhub.cn/ai/release.md）
#      前提：仓库 Secret SKILLHUB_KEY = skillhub.cn 个人中心创建的 API Token
#      （需先完成实名认证）；未配置时该 job 告警跳过，不影响 Release/npm。
#      注意：slug（skill/scu-cli/SKILL.md 的 slug 字段）全网唯一，若发布报
#      slug 冲突需改名后保持固定；发布后进入 pending_review 审核。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          mkdir -p dist
          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"
          for t in $targets; do
            os=${t%/*}; arch=${t#*/}
            out="dist/scu-${os}-${arch}"
            if [ "$os" = "windows" ]; then out="$out.exe"; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/The-Brotherhood-of-SCU/SCU-CLI/internal/cli.Version=${GITHUB_REF_NAME}" \
              -o "$out" ./cmd/scu
          done
          cd dist && sha256sum scu-* > checksums.txt

      - name: Package skill
        run: |
          # skill/scu-cli/ 即技能目录本体（目录名 = 技能名），直接打包；
          # 解压到 ~/.claude/skills/ 即为标准安装结构
          cp -r skill/scu-cli dist/
          cd dist && zip -r scu-cli-skill.zip scu-cli && rm -rf scu-cli

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) found = 1
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md 中未找到版本 [$version] 的章节"
            exit 1
          fi
          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/scu-*
            dist/checksums.txt

  # npm 包的 postinstall 从 GitHub Release 下载二进制，故必须等 release job 完成。
  # 发布认证走 OIDC Trusted Publishing（npm CLI ≥ 11.5.1，无需 NPM_TOKEN），
  # 并自动生成 provenance 证明。
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      id-token: write # OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # trusted publishing 要求 npm ≥ 11.5.1；Node 22 自带 npm 10，Node 24 自带 npm 11
          node-version: 24

      - name: Stamp version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: npm publish --access public

  # 发布 Skill 到 SkillHub（与 npm job 并行，只需源码，不依赖 Release 产物；
  # needs: release 保证构建失败时不发布任何渠道）。
  # skillhub CLI 官方安装脚本仅支持 macOS/Linux，ubuntu runner 满足。
  skillhub:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@v4

      - name: Check SKILLHUB_KEY
        id: key
        env:
          SKILLHUB_KEY: ${{ secrets.SKILLHUB_KEY }}
        run: |
          if [ -z "${SKILLHUB_KEY:-}" ]; then
            echo "::warning::未配置 Secret SKILLHUB_KEY，跳过 SkillHub 发布（见 release.yml 头部注释）"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install SkillHub CLI
        if: steps.key.outputs.present == 'true'
        run: |
          curl -fsSL https://skillhub.cn/install/install.sh | bash -s -- --cli-only
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/skillhub" --version

      - name: Stamp skill version from tag
        if: steps.key.outputs.present == 'true'
        # SKILL.md 的 version 以标签为准（语义化版本，去掉 v 前缀）
        run: |
          sed -i "s/^version: .*/version: ${GITHUB_REF_NAME#v}/" skill/scu-cli/SKILL.md

      - name: Login and dry-run
        if: steps.key.outputs.present == 'true'
        env:
          SKILLHUB_KEY: ${{ secrets.SKILLHUB_KEY }}
        run: |
          skillhub login --key "$SKILLHUB_KEY" --host https://api.skillhub.cn
          skillhub publish skill/scu-cli --host https://api.skillhub.cn --dry-run

      - name: Publish to SkillHub
        if: steps.key.outputs.present == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) found = 1
              next
            }
            found { print }
          ' CHANGELOG.md)
          skillhub publish skill/scu-cli --host https://api.skillhub.cn \
            --changelog "${notes:-发布 $version}"
