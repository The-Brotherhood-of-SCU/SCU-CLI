<body>
  <div id="cprint" class="wrap relative">
    <div class="main">
      <div class="container">
        <div class="tab-page">
          <form id="tf" class="noselect">
            <!--<form action="/api/client/CloudPrint/Upload" method="post" enctype="application/x-www-form-urlencoded">-->
            <div class="file-wrap fs14">
              <div class="label">
                <span class="idQuery" data-id="610007">文件</span>
                :
              </div>
              <div class="file-choose relative clearfix">
                <div id="selectfile" class="file-choose-btn idQuery fl" data-id="640022">
                  选择文件
                </div>
                <div class="reselect-btn file-choose-btn idQuery hide fl" data-id="640072">
                  重新选择
                </div>
                <div class="filename fl idQuery" data-id="640113">
                  备注：未上传附件
                </div>
                <div class="fl filesize" style="margin-left: 10px;">文件大小限制:<span id="filesize"></span></div>
                <input type="file" id="file" name="szPath"/>
              </div>
              <p class="file-can idQuery">
                <span class="idQuery" data-id="640023">支持</span>
                ：jpg，png，word，excel，pdf，txt，ppt
              </p>
            </div>
            <div class="color-wrap attr-wrap clearfix fs14">
              <div class="label">
                <span class="idQuery" data-id="640028">颜色</span>
                :
              </div>
              <label id="black_wrap_js" class="radio fs16 relative first">
                <input checked type="radio" name="dwColor" class="wb dwcolor" value="1" />
                <span class="style-input active"><i></i></span>
                <span class="idQuery pdr12" data-id="640029">黑白</span>
                <i class="icon_color icon_color2"></i>
              </label>
              <label id="colorful_wrap_js" class="radio fs16 relative">
                <input type="radio" name="dwColor" value="2" class="dwcolor" />
                <span class="style-input"><i></i></span>
                <span class="idQuery pdr12" data-id="640030">彩色</span>
                <i class="icon_color icon_color1"></i>
              </label>
            </div>
            <div class="fouritem_wrap clearfix">
              <div class="attr-wrap clearfix fs14">
                <div class="label">
                  <span class="idQuery" data-id="640016">纸型</span>
                  :
                </div>
                <label class="radio fs16 relative first firstType">
                  <input checked type="radio" id="dwPaperId256" name="dwPaperId" class="wb dwPaperId" value="-1" />
                  <span class="style-input active"><i></i></span>
                  <span class="idQuery" data-id="640401">不指定</span>
                </label>
                <label class="radio fs16 relative secondType">
                  <input type="radio" id="dwPaperId9" name="dwPaperId" class="dwPaperId" value="9" />
                  <span class="style-input"><i></i></span>
                  <span>A4</span>
                </label>
                <label class="radio fs16 relative thirdType">
                  <input type="radio" id="dwPaperId8" name="dwPaperId" value="8" class="dwPaperId" />
                  <span class="style-input"><i></i></span>
                  <span>A3</span>
                </label>
              </div>
              <div class="color-wrap attr-wrap clearfix fs14">
                <div class="label">
                  <span class="idQuery" data-id="640024">单双面</span>
                  :
                </div>
                <label class="radio fs16 relative first">
                  <input checked type="radio" name="dwDuplex" class="wb dwDuplex" value="1" />
                  <span class="style-input active"><i></i></span>
                  <span class="idQuery active" data-id="640025">单面</span>
                </label>
                <label class="radio fs16 relative">
                  <input type="radio" name="dwDuplex" value="2" class="dwDuplex" />
                  <span class="style-input"><i></i></span>
                  <span class="idQuery" data-id="640026">双面短边</span>
                </label>
               <!-- <label class="radio fs16 relative">
                  <input type="radio" name="dwDuplex" value="3" class="dwDuplex" />
                  <span class="style-input"><i></i></span>
                  <span class="idQuery" data-id="640027">双面长边</span>
                </label>-->
              </div>
              <!-- <div class="color-wrap attr-wrap clearfix fs14">
                <div class="label">
                  <span class="idQuery" data-id="640024">页数</span>
                  :
                </div>
                <label class="radio fs16 relative first">
                  <input checked type="radio" name="dwDuplex" class="wb dwDuplex" value="1" />
                  <span class="style-input active"><i></i></span>
                  <span class="idQuery active" data-id="641002">全部</span>
                </label>
                <label class="radio fs16 relative">
                  <input type="radio" name="dwDuplex" value="2" class="dwDuplex" />
                  <span class="style-input"><i></i></span>
                  <span class="idQuery" data-id="641003">部分</span>
                </label>
              </div> -->
              <div class="color-wrap  attr-wrap clearfix fs14 pagebox">
                <div class="label">
                  <span class="idQuery" data-id="641001">页数</span>
                  :
                </div>
                <label class="radio fs16 relative first fl">
                  <input checked type="radio" name="dwFrom" class="wb dwDuplex" value="0" />
                  <span class="style-input active"><i></i></span>
                  <span class="idQuery active" data-id="641002">全部</span>
                </label>
                <label class="radio fs16 relative range fl">
                  <input type="radio" name="dwFrom" value="1" class="dwDuplex" />
                  <span class="style-input"><i></i></span>
                  <span class="idQuery" data-id="641003">部分</span>
                </label>
                <div class="fs16 relative pagestyle none">
                  <input type="text" class="fl" value="1" id="dwFrom"  min="1"/>
                  <p class="fl biao">~</p>
                  <input type="text" class="fl"
                    value="1" id="dwTo" min="1"/>
                  <p class="fl text" data-id="641004">页</p>
                </div>
              </div>
              <div class="count-wrap attr-wrap clearfix fs14" style="padding-bottom: 14px;">
                <div class="label fl idQuery">
                  <span class="idQuery" data-id="640031">份数</span>
                  :
                </div>
                <span class="handle-num fl" data-value="-1">-</span>
                <input id="dwCopies" name="dwCopies" type="text" class="fl" value="1" />
                <span class="handle-num fl" data-value="1">+</span>
              </div>
              <!-- <div style="margin-left: 70px;">
                <label>
                  <input id="dwPdfImage" name="dwPdfImage" type="checkbox" disabled />
                  <span class="idQuery" data-id="64118">图像模式输出（预览有乱码时请选择）</span>
                </label>
              </div> -->
              <div class="idQuery" style="
                    padding-bottom: 30px;
                    padding-left: 73px;
                    color: #ff6d6d;
                  " data-id="64117">
                纸型和单双面设置功能有些文档暂不支持。
              </div>
            </div>
            <input class="hide" type="text" id="BackURL" name="BackURL" value="result.html" />
            <div class="btnbox relative">
              <button id="upfile" class="fs42 disabled idQuery" type="submit" disabled data-id="640032">
                确定
              </button>
              <img class="loadbtn" src="./image/loading.gif" alt="" />
            </div>
          </form>
        </div>
      </div>
    </div>
    <div class="footer"></div>
  </div>
  <div class="all-loading1"></div>
