<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge"/>
    <meta charset="UTF-8"/>
    <meta name="description" content=""/>
    <meta name="keywords" content="云打印,打印,自助打印,联创自助打印,打印驱动"/>
    <!--<meta name="viewport" content="width=1226"/>-->
    <!--<meta http-equiv="x-dns-prefetch-control" content="on">-->
    <meta content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" name="viewport">
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon"/>
    <meta http-equiv="Cache-Control" content="no-transform,no-cache,must-revalidate"/>
    <meta http-equiv="Cache-Control" content="no-siteapp"/>
    <meta http-equiv="pragma" content="no-cache">
    <script type="text/javascript">
        document.write("<link rel='stylesheet' type='text/css' href='./css/base.css?_v=" + Math.random() + "' />");
        document.write("<link rel='stylesheet' type='text/css' href='./css/public.css?_v=" + Math.random() + "' />");
        document.write("<link rel='stylesheet' type='text/css' href='./css/printDoc.css?_v=" + Math.random() + "' />");
    </script>
    <title>联创云打印</title>
    <!--[if lt IE 10]>
    <script src="./lib/css3-mediaqueries.js"></script>
    <script src="./lib/html5.js"></script>
    <![endif]-->
</head>
<body>
<div id="printDoc" class="wrap relative print_scan_wrap">
    <div class="main">
        <div class="container">
            <div id="footbar" class="handlebar noselect hide">
                <label class="checkbox checked-btn fl">
                    <input id="all-select-btn" type="checkbox" name="allscandoc1">
                    <span data-id="640060" class="idQuery">全选</span>
                </label>
                <!--<a id="del-btn" class="fl alldel disabled handle-btn idQuery" data-id="640033" href="javascript:;">删除</a>-->
                <a id="del-btn" class="fl downbtn disabled handle-btn" href="javascript:;">
                    <i class="icon_del"></i>
                    <span class="idQuery" data-id="640033">删除</span>
                </a>
                <div class="right fr" style="height: 100%;">
                    <span class="idQuery" data-id="640089">已选</span><span class="num" id="select-num">0</span>
                </div>
            </div>
            <div class="tab-page relative">
                <ul id="printul" class="printlist splist">

                </ul>
                <div class="nolist hide fs14">
                    <i class="icon_noprint"></i>
                    <span class="idQuery" data-id="640057">没有打印文档噢</span>
                </div>
                <div class="loading"></div>
            </div>
        </div>
    </div>
    <div id="pre" class="prewrap hide">
        <div class="maskbg"></div>
        <div class="info">
            <a class="close-btn" href="javascript:;">
                <i class="icon_close2"></i>
            </a>
            <a class="nextbtn handlebtn fs36" data-type="1" href="javascript:;"><i class="icon_next"></i></a>
            <a class="beforebtn handlebtn fs36" data-type="-1" href="javascript:;"><i class="icon_before"></i></a>
            <div class="pagenum"><span id="nownum">1</span>/<span id="totalnum"></span></div>
            <div class="imgbox">
                <img id="preimg" alt="">
            </div>
        </div>
    </div>
</div>
<div class="footer"></div>
<div class="all-loading1"></div>
<script type="text/html" id="plist-template">
    {{each result as $value index}}
    <li class="clearfix relative">
        <label class="checkbox checked-btn fl">
            <input type="checkbox" name="scandoc" data-dwJobId="{{$value.dwJobId}}">
        </label>
        <a class="prebtn fl relative pre_js" href="javascript:;" data-dwJobId="{{$value.dwJobId}}"
           data-pages="{{$value.szPaperDetail[0].dwBWPages+$value.szPaperDetail[0].dwColorPages}}"><i class="icon_pre {{$value.x_doctype.classtype}}"><span>{{$value.x_doctype.type}}</span></i></a>
        <div class="left fl">
            <h4 class="break1 pre_js" title="{{$value.szJobName}}" data-dwJobId="{{$value.dwJobId}}" data-dwCreateTime="{{$value.dwCreateTime}}" data-pages="{{$value.szPaperDetail[0].dwBWPages+$value.szPaperDetail[0].dwColorPages}}">{{$value.x_szJobName}}</h4>
            <div class="info break1">
                {{$value.szPaperDetail[0].x_dwPaperID}};
                {{if $value.szAttribe.indexOf("color")!=-1}}
                <span class="idQuery" data-id="640030">彩色</span>;
                {{else}}
                <span class="idQuery" data-id="640029">黑白</span>;
                {{/if}}
                {{if $value.szAttribe.indexOf("vdup")!=-1}}
                <span class="idQuery" data-id="640026">双面长边</span>;
                {{ else if $value.szAttribe.indexOf("single")!=-1}}
                <span class="idQuery" data-id="640025">单面</span>;
                {{else}}
                <span class="idQuery" data-id="640027">双面短边</span>;
                {{/if}}
                {{$value.dwCopies}}
                <span class="idQuery" data-id="610047">份</span>

            </div>
        </div>
        <div class="right fr">
            <span>{{$value.x_dwCreateDate}}<br/> {{$value.x_dwCreateTime}}</span>
        </div>
        <!--<a class="delbtn idQuery" href="javascript:;" data-dwJobId="{{$value.dwJobId}}"-->
        <!--data-id="640033">删除</a>-->
    </li>
    {{/each}}
</script>
</body>
<script src="./lib/jquery.min.js"></script>
<script src="./lib/template.js"></script>
<script src="./lib/json2.js"></script>
<script type="text/javascript">
    document.write("<script type='text/javascript' src='../setconfig.js?v=" + Math.random() + "'><\/script>");
    document.write("<script type='text/javascript' src='./js/host.js?v=" + Math.random() + "'><\/script>");
    document.write("<script type='text/javascript' src='./js/common.js?v=" + Math.random() + "'><\/script>");
    document.write("<script type='text/javascript' src='./js/printDoc.js?v=" + Math.random() + "'><\/script>");
</script>
</html>
